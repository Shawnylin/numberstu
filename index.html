<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="百化分" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>百化分 · 速算训练</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#172033;background:#f6f7fb;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f7fb;touch-action:manipulation}button,input{font:inherit}button{cursor:pointer;border:0}
    .app{max-width:480px;min-height:100vh;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:#172033;color:white;display:grid;place-items:center;font-size:18px;font-weight:800}.eyebrow{font-size:12px;color:#778197;letter-spacing:.08em}.brand h1{font-size:18px;margin:2px 0 0;letter-spacing:-.02em}.mode{background:white;color:#40506d;border:1px solid #e4e8f0;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;box-shadow:0 3px 12px #1720330a}
    .stats{display:flex;gap:24px;margin-top:30px}.stat strong{display:block;font-size:18px}.stat span{font-size:12px;color:#8791a5}.bar{height:5px;background:#e4e8f0;border-radius:99px;margin-top:17px;overflow:hidden}.bar i{display:block;height:100%;background:#6079c9;border-radius:99px;width:0;transition:width .2s}
    .card{background:white;border:1px solid #e5e9f0;border-radius:24px;margin-top:20px;padding:30px 22px 24px;box-shadow:0 12px 30px #1720330b;text-align:center}.label{font-size:13px;color:#7b879d}.prompt{font-size:56px;line-height:1.05;letter-spacing:-.06em;font-weight:800;margin:15px 0 26px}.answer-line{display:flex;align-items:center;justify-content:center;gap:9px;color:#6d7890}.answer-line span{font-size:21px}.answer-input{width:130px;border:0;border-bottom:2px solid #cad1df;background:transparent;outline:0;text-align:center;font-size:27px;font-weight:700;color:#172033;padding:3px 4px}.answer-input:focus{border-color:#6079c9}.feedback{min-height:24px;font-size:13px;margin-top:14px;font-weight:600}.feedback.ok{color:#2d8065}.feedback.bad{color:#bd5960}.feedback.hint{color:#758198}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.key{height:53px;border-radius:15px;background:white;border:1px solid #e3e7ef;color:#26334b;font-size:20px;font-weight:650;box-shadow:0 3px 10px #17203308}.key:active{background:#eef1f8;transform:scale(.98)}.key.action{font-size:14px;color:#66738b;background:#f0f2f7}.key.enter{background:#6079c9;color:white;border-color:#6079c9;font-size:15px}.install-note{display:none}
    .answer-reveal{display:none;margin:8px auto 0;padding:6px 10px;border:1px solid #dfe4ee;border-radius:9px;background:#f7f8fb;color:#68758d;font-size:12px}.answer-reveal.show{display:inline-block}
    @media (prefers-reduced-motion:reduce){.bar i{transition:none}.key:active{transform:none}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><div class="mark">%</div><div><div class="eyebrow">资料分析 · 速算训练</div><h1>百化分</h1></div></div><button class="mode" id="modeBtn">看分数</button></header>
  <section class="stats"><div class="stat"><strong id="progress">1 / 30</strong><span>本轮进度</span></div><div class="stat"><strong id="accuracy">0%</strong><span>本轮正确率</span></div></section>
  <div class="bar"><i id="bar"></i></div>
  <section class="card"><div class="label" id="questionLabel">这个分数约等于</div><div class="prompt" id="prompt">5.3%</div><div class="answer-line"><span>1 /</span><input id="answer" class="answer-input" inputmode="none" autocomplete="off" readonly aria-label="答案" /></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="answer-reveal" id="revealBtn" type="button">查看答案</button></section>
  <div class="keypad" id="keypad"><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key action" data-key="clear">退格</button><button class="key" data-key="0">0</button><button class="key" data-key="decimal">.</button><button class="key enter" data-key="enter">确认</button></div>
</main>
<script>
const pairs=[['5.3%','19'],['7.7%','13'],['12%','8.3'],['16%','6.25'],['24%','4.2'],['5.6%','18'],['8.3%','12'],['12.5%','8'],['16.7%','6'],['27%','3.7'],['5.9%','17'],['9.1%','11'],['13%','7.7'],['17%','5.9'],['28.6%','3.5'],['6.25%','16'],['9.5%','10.5'],['14%','7.1'],['18%','5.6'],['37%','2.7'],['6.7%','15'],['10.5%','9.5'],['14.3%','7'],['19%','5.3'],['42%','2.4'],['7.1%','14'],['11.1%','9'],['15%','6.7'],['22.2%','4.5'],['67%','1.5']];
let index=0,attempts=0,correct=0,mode='percent'; const $=id=>document.getElementById(id); const input=$('answer');
function render(){const p=pairs[index]; $('prompt').textContent=mode==='percent'?p[0]:'1 / '+p[1]; $('questionLabel').textContent=mode==='percent'?'这个分数约等于':'这个分数约等于百分之'; $('progress').textContent=`${index+1} / ${pairs.length}`; $('accuracy').textContent=attempts?Math.round(correct/attempts*100)+'%':'0%'; $('bar').style.width=((index)/pairs.length*100)+'%'; input.value=''; $('feedback').textContent='';$('feedback').className='feedback';$('revealBtn').className='answer-reveal';$('revealBtn').textContent='查看答案';}
function submit(){if(!input.value)return; attempts++;const expected=mode==='percent'?pairs[index][1]:pairs[index][0].replace('%','');const ok=input.value===expected;if(ok){correct++;$('feedback').textContent='正确，继续保持';$('feedback').className='feedback ok';setTimeout(()=>{index=(index+1)%pairs.length;render()},420)}else{input.value='';$('feedback').textContent='答案不对，再试一次';$('feedback').className='feedback bad';$('revealBtn').className='answer-reveal show';$('accuracy').textContent=Math.round(correct/attempts*100)+'%';}}
let clearTimer=0,longCleared=false;const clearKey=document.querySelector('[data-key="clear"]');clearKey.addEventListener('pointerdown',()=>{longCleared=false;clearTimer=setTimeout(()=>{input.value='';longCleared=true},550)});['pointerup','pointercancel','pointerleave'].forEach(type=>clearKey.addEventListener(type,()=>clearTimeout(clearTimer)));clearKey.addEventListener('click',()=>{if(!longCleared)input.value=input.value.slice(0,-1)});clearKey.addEventListener('contextmenu',e=>e.preventDefault());$('keypad').addEventListener('click',e=>{const k=e.target.dataset.key;if(!k||k==='clear')return;if(k==='enter')submit();else if(k==='decimal'){if(!input.value.includes('.')&&input.value.length<5)input.value+=input.value?' .'.trim():'.'}else if(input.value.length<5)input.value+=k});$('revealBtn').addEventListener('click',()=>{$('revealBtn').textContent=mode==='percent'?`答案：1 / ${pairs[index][1]}`:`答案：${pairs[index][0]}`;$('revealBtn').className='answer-reveal show hint'});$('modeBtn').addEventListener('click',()=>{mode=mode==='percent'?'fraction':'percent';$('modeBtn').textContent=mode==='percent'?'看分数':'看百分数';render()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
